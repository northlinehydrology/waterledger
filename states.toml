[PA]
name = "Pennsylvania"
example = "Pittsburgh city, PA"
attains = "21PA"
agency = "Pennsylvania DEP"
places = "cities, boroughs and towns"
weather_check = "Pennsylvania failed one of the ERA5 check's criteria. At the shore, corrected cells run 0.85 C off in the design dry-bulb (the limit is 0.5 C), set by New York and New Jersey coastal stations within 100 km of Pennsylvania places; the correction still improves on ERA5 alone (1.35 C). Erie's cells are not corrected: its airport is the one station near them and no other shore station is within 100 km, and ERA5 runs 2.25 C cool in the design dry-bulb there, so hybrid and pads estimates around Erie run low. Places pass: hybrid and pads differ from the stations' by a median of about 0.4% of towers' water on an average day and 3 to 5% on the peak day, and cooling towers by 0.6% (docs/methods/era5-checks/pa.md)."

