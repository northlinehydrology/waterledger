[NY]
name = "New York"
example = "Buffalo city, NY"
attains = "21NYDECA"
agency = "New York DEC"
places = "cities and villages"
subdivisions = "towns"
weather_check = "New York failed two of the ERA5 check's criteria. The check corrects each place's cell without its own station, as for a place with no station nearby; about half of New York's places have none within 40 km. Corrected shore cells (Lake Ontario, the St. Lawrence, Long Island and New York Harbor) run 0.81 C off in the design dry-bulb (limit 0.5 C); the correction still improves on ERA5 alone (1.00 C). On the peak day, pads differ from the stations' by a median 6.2% of towers' water (limit 6%): upstate cells run cool, so at North Syracuse and Gates (Rochester) hybrid and pads peak days run 13 to 21% of towers' peak day low. On an average day hybrid and pads are within about 1% of towers' water at every place checked, and cooling towers within 2% (docs/methods/era5-checks/ny.md)."

[AZ]
name = "Arizona"
example = "Mesa city, AZ"
attains = "21ARIZ"
agency = "Arizona DEQ"
places = "cities and towns"
weather_check = "Arizona failed six of the ERA5 check's criteria, three of them in the weather. Seventeen stations were checked, each left out of its own cell's correction, as for a place with no station nearby; 44% of Arizona's places are within 40 km of one, and seven of the stations have no other land station within 100 km. In the design dry-bulb, land cells are off by a median 0.82 C (the limit is 0.75) and run 0.57 C cool on average (limit 0.5); the 0.4% wet bulb is off by 0.41 C (limit 0.40). In Arizona's heat hybrid and pads evaporate a larger share of towers' water than in the other states, so the same weather errors weigh more: on an average day hybrid differs from the stations' by a median 1.5% of towers' water (limit 1%) and pads by 2.9% (limit 1%), and pads' peak day by 8.6% (limit 6%), with no strong lean either way. The terrain is finer than ERA5's grid, so desert places away from a station (Tucson, Safford) run about 3 to 6% of towers' water low on an average day, and high-country places (Prescott, Tusayan) and Kingman run 10 to 12% of towers' peak day high. Hybrid's peak day passes (5.0%) and cooling towers are within 1.5% (docs/methods/era5-checks/az.md)."
