[project]
name = "waterledger-data"
version = "0.1.0"
description = "Public U.S. water data for any place, fetched once and cached: Census places, EPA water systems and sewer plants, USGS watersheds, EPA ATTAINS, NOAA weather and design storms, EIA utilities"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Andrew Sommerlot" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterledger_data"]
