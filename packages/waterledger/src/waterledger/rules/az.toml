# Arizona's rules for large new water users, as data (waterledger.rules). Every line was read against its source on `checked`.
checked = "2026-11-20"

[withdrawals]
# One statewide line: an exempt well has a pump capacity of 35 gallons a minute or less (A.R.S. 45-402, 45-454), 0.0504 MGD on the peak day. Above it, inside an
# Active Management Area a well needs a grandfathered right, a service area right or a withdrawal permit from ADWR (45-512); outside the AMAs, groundwater is
# withdrawn for reasonable and beneficial use with a notice of intention to drill and no permit or volume limit (45-453, 45-596). AMAs are groundwater basins,
# not counties: az_areas.json (tools/rule_areas.py, from ADWR's AMA and INA boundaries) says which places are inside, and a place partly inside sees both rules.
period = "capacity"
summary = "Arizona’s rules turn on whether a well is in an Active Management Area. Inside one (Phoenix, Pinal, Prescott, Tucson, Santa Cruz, Willcox, Douglas and Ranegras Plain, in ADWR’s boundaries), a well pumping more than 35 gallons a minute needs a groundwater right or a withdrawal permit from ADWR. Outside them, groundwater is pumped for reasonable and beneficial use with a notice of intention to drill and no permit or volume limit. In an Irrigation Non-Expansion Area, a well pumping more than 10 acre-feet a year for other uses is metered and reported to ADWR."
sources = ["az_45_402", "az_45_454", "az_45_512", "az_45_453", "az_45_596"]

below_tag = "Within the exempt-well size"
[[withdrawals.lines]]
key = "nonexempt"
mgd = 0.0504
level = "mid"
tag = "Larger than an exempt well"
sources = ["az_45_402", "az_45_454"]

[[withdrawals.lines]]
key = "ama_right"
mgd = 0.0504
areas = ["ama"]
level = "large"
tag = "Needs a groundwater right or permit"
flag = "The wells would pump more than 35 gallons a minute. In an Active Management Area, a well that large needs a grandfathered right, a service area right or a withdrawal permit from ADWR."
sources = ["az_45_402", "az_45_512", "adwr_ama"]

[discharge]
permit_note = "ADEQ issues the permit (AZPDES), and Arizona’s standards limit a thermal discharge’s warming of a stream to 3.0 °C for warm-water aquatic life uses and 1.0 °C for cold-water uses."
sources = ["az_r18_11_109"]

[septic]
sources = ["az_r18_9_a309", "az_r18_9_e302", "az_r18_9_e323"]

[[septic.lines]]
below_gpd = 3000
text = "the system is built under a Type 4 general permit from ADEQ’s rules, with a construction authorization and then a discharge authorization"

[[septic.lines]]
below_gpd = 24000
text = "the system falls under ADEQ’s general permit for 3,000 to 24,000 gallons a day, with an engineer’s sealed design and a nitrogen loading limit"

[[septic.lines]]
text = "a system of 24,000 gallons a day or more needs an individual aquifer protection permit from ADEQ"

