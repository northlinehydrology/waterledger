# Pennsylvania's rules for large new water users, as data (waterledger.rules). Every line was read against its source on `checked`.
checked = "2026-11-20"

[withdrawals]
# Statewide: registration with DEP of a withdrawal over 10,000 gallons a day averaged over 30 days, surface and groundwater (27 Pa.C.S. 3118; 25 Pa. Code
# 110.201); registration, not a permit. Susquehanna basin (HUC 0205): SRBC approval for a withdrawal of 100,000 gallons a day or more and a consumptive use of
# 20,000 or more, each over a consecutive 30-day average (18 CFR 806.4); the estimate has no 30-day figure for water used up, so its highest 90 days stands in
# [A]. Delaware basin (HUC 0204): DRBC review above 100,000 gallons a day over 30 consecutive days (18 CFR 401.35); in the Southeastern Pennsylvania Ground Water
# Protected Area no one may withdraw groundwater at more than 10,000 gallons a day except as the rule allows (18 CFR 430.7; 30 days in DRBC's FAQ). The area is
# the Delaware-basin parts of listed townships and boroughs and all of Montgomery County: pa_areas.json (tools/rule_areas.py, DRBC's boundary) places each place.
# Lake Erie basin: DEP applies Act 43 of 2008's line, a new or increased withdrawal of 100,000 gallons a day or more over 90 days, through its permit programs
# (DEP's Great Lakes report).
period = "30 days"
summary = "Pennsylvania requires a withdrawal of more than 10,000 gallons a day, averaged over 30 days, to be registered with DEP. In the Susquehanna basin, the Susquehanna River Basin Commission approves a withdrawal of 100,000 gallons a day or more and a consumptive use of 20,000 or more; in the Delaware basin, the Delaware River Basin Commission reviews a withdrawal above 100,000 gallons a day, and above 10,000 in the Southeastern Pennsylvania Ground Water Protected Area."
basin_summary = "Pennsylvania requires a withdrawal of more than 10,000 gallons a day, averaged over 30 days, to be registered with DEP. In the Lake Erie basin, a new or increased withdrawal of 100,000 gallons a day or more, averaged over 90 days, is reviewed by DEP under Pennsylvania’s Great Lakes Compact law."
sources = ["pa_110_201", "pa_27_3118", "srbc_806_4", "drbc_401_35", "pa_dep_great_lakes"]

[[withdrawals.lines]]
key = "register"
mgd = 0.01
level = "mid"
tag = "Must register with the state"
sources = ["pa_110_201", "pa_27_3118"]

[[withdrawals.lines]]
key = "sepa_gwpa"
mgd = 0.01
areas = ["sepa_gwpa"]
source = ["ground"]
level = "large"
tag = "Needs DRBC approval"
flag = "The estimated pumping is above 10,000 gallons a day. In the Southeastern Pennsylvania Ground Water Protected Area, a groundwater withdrawal that large needs the Delaware River Basin Commission’s approval."
sources = ["drbc_430_7", "drbc_gwpa_map"]

[[withdrawals.lines]]
key = "srbc_consumptive"
mgd = 0.02
at_least = true
measure = "consumed"
huc = ["0205"]
level = "large"
tag = "Needs SRBC approval"
flag = "The water used up is estimated at 20,000 gallons a day or more. In the Susquehanna basin that needs the Susquehanna River Basin Commission’s approval."
sources = ["srbc_806_4"]

[[withdrawals.lines]]
key = "srbc_withdrawal"
mgd = 0.1
at_least = true
huc = ["0205"]
level = "large"
tag = "Needs SRBC approval"
flag = "The estimated pumping reaches 100,000 gallons a day over 30 days. In the Susquehanna basin that needs the Susquehanna River Basin Commission’s approval."
sources = ["srbc_806_4"]

[[withdrawals.lines]]
key = "drbc_review"
mgd = 0.1
huc = ["0204"]
level = "large"
tag = "Needs DRBC review"
flag = "The estimated pumping is above 100,000 gallons a day over 30 days. In the Delaware basin that needs the Delaware River Basin Commission’s review."
sources = ["drbc_401_35"]

[[withdrawals.lines]]
key = "great_lakes_review"
mgd = 0.1
at_least = true
period = "90 days"
where = "great_lakes_basin"
level = "large"
tag = "Needs state review"
flag = "The estimated pumping reaches 100,000 gallons a day. In Pennsylvania’s Lake Erie basin, a new or increased withdrawal of that much, averaged over 90 days, is reviewed by DEP under the state’s Great Lakes Compact law."
sources = ["pa_dep_great_lakes"]

[discharge]
permit_note = "DEP issues the permit, and Pennsylvania’s standards set stream temperature limits for heated discharges by half-month and by fishery, such as 87 °F in July for warm water fishes and 66 °F for cold water fishes."
sources = ["pa_93_7"]

[septic]
sources = ["pa_72_1", "pa_72_2", "pa_72_21"]

[[septic.lines]]
max_gpd = 10000
text = "the local agency’s sewage enforcement officer permits the system under the Sewage Facilities Act"

[[septic.lines]]
text = "a system of more than 10,000 gallons a day is a large volume system, which no local agency may permit; DEP regulates it under the Clean Streams Law"

[lake_erie]
note = "Pennsylvania’s Lake Erie plan adopts the central basin target of 6,000 tonnes of phosphorus a year, about a 40% cut from 2008 levels."
sources = ["pa_dap"]

[large_load]
mw = 50
utility = "^PPL Electric"
text = "At 50 MW or more at one facility (or 75 MW across facilities within 10 miles), a data center on PPL Electric’s system takes service under Rate Schedule LP-6 from July 2026: a contract of at least 10 years and minimum bills of 80% of its ramp load (50% in years 6 to 10 once its security obligation is met)."
caption = "50 MW is the line in PPL Electric’s LP-6 large-load schedule"
sources = ["ppl_lp6"]

