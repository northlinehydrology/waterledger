# Texas's rules for large new water users, as data (waterledger.rules). Every line was read against its source on `checked`.
checked = "2026-11-20"

[withdrawals]
# Texas sets no statewide permit threshold for wells. Groundwater conservation districts permit wells under their own rules (Water Code
# 36.113(a)); the only gallons figure in Chapter 36 is the mandatory exemption for a domestic or livestock well on more than 10 acres that can't produce more
# than 25,000 gallons a day (36.117(b)(1)), which a data center's well isn't. The Edwards Aquifer Authority permits every withdrawal in its area (EAA Act
# 1.15). Surface water is state water and needs a TCEQ water right with no volume line (11.121). The large-load line (75 MW, 16 TAC 25.194) applies in the
# ERCOT region only and isn't carried here: the tariff's utility pattern would have to name every ERCOT utility (see rules.md).
# The district line: a district "shall require a permit" for a well it doesn't exempt (36.113(a)), so any pumping inside one needs a district permit unless the
# district's own rules exempt it (mgd 0: any amount). tx_areas.json (tools/rule_areas.py, from TWDB's district boundaries, Nov 2019, which TWDB calls approximate)
# says which places are inside; it includes the Edwards Aquifer Authority and the Harris-Galveston and Fort Bend subsidence districts.
summary = "Texas sets no statewide permit line for wells. Groundwater conservation districts, which cover 173 of the state’s 254 counties, require permits for wells under their own rules, the Edwards Aquifer Authority permits every withdrawal in its area, and the Harris-Galveston and Fort Bend subsidence districts require a permit for every well. Surface water needs a water right from TCEQ."
sources = ["tx_wa_36", "tx_eaa_act", "tx_sd_8801", "tx_sd_8834", "tx_wa_11", "twdb_gcd"]
below_tag = "Outside any groundwater district"

[[withdrawals.lines]]
key = "district_permit"
mgd = 0.0
areas = ["gcd"]
level = "large"
tag = "Needs a district permit"
flag = "Inside a Texas groundwater district, a well the district’s rules don’t exempt needs the district’s permit, and the district sets how much it may pump."
sources = ["tx_wa_36", "tx_sd_8801", "tx_sd_8834", "twdb_gcd_map"]

[discharge]
permit_note = "TCEQ issues the permit (TPDES), and Texas’s standards limit warming above ambient to 5 °F in freshwater streams and 3 °F in lakes and reservoirs, outside the mixing zone the permit sets."
sources = ["tx_307_4"]

[septic]
sources = ["tx_hs_366", "tx_285_3"]

[[septic.lines]]
max_gpd = 5000
text = "an on-site sewage facility is permitted by the local authorized agent, or by TCEQ where there is none"

[[septic.lines]]
text = "a system treating more than 5,000 gallons a day on one property is outside the on-site sewage rules and may need a TCEQ permit"

