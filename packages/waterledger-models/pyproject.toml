[project]
name = "waterledger-models"
version = "1.2.0"
description = "Water Ledger's models: weather-driven data center cooling water (towers, hybrid, closed loop, lake-source) with Monte Carlo uncertainty, staff water, and site runoff quality"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Andrew Sommerlot" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterledger_models"]
