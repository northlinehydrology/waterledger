[project]
name = "waterledger-models"
version = "3.7.0"
description = "Water Ledger's models: weather-driven data center cooling water (towers, hybrid, closed loop, lake-source) with Monte Carlo uncertainty, staff water, and site runoff quality"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Northline Hydrology", email = "info@northlinehydrology.com" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ensemble = ["xarray>=2023.1", "dask[array]>=2023.1"]      # vectorized Monte Carlo ensembles as xarray, dask across locations
bmi = ["bmipy>=2.0", "pyyaml>=6", "xarray>=2023.1"]       # CSDMS Basic Model Interface components for coupling frameworks
stac = ["pystac>=1.10", "zarr>=2.16", "xarray>=2023.1", "dask[array]>=2023.1"]   # publish ensemble results as zarr with a STAC catalog
all = ["waterledger-models[ensemble,bmi,stac]"]

[project.urls]
Homepage = "https://waterledger.org"
Source = "https://github.com/northlinehydrology/waterledger"
Issues = "https://github.com/northlinehydrology/waterledger/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterledger_models"]
