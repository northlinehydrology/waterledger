name: build-state
# Build one state's data from the public sources on GitHub's machines, check it, write its snapshot (design 0003), and,
# when asked, upload the snapshot to Cloudflare R2 (data.waterledger.org). Run by hand: Actions -> build-state -> Run
# workflow. Uploading needs the repository secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY.
on:
  workflow_dispatch:
    inputs:
      state:
        description: "State postal code"
        required: true
        default: "OH"
      upload:
        description: "Upload the snapshot to R2"
        type: boolean
        default: false
      snapshot_id:
        description: "Snapshot name, if not today's date: a published snapshot never changes, so a second build the same day is YYYY-MM-DD.2"
        required: false
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WATERLEDGER_CACHE: ${{ github.workspace }}/.wlcache
      WATERLEDGER_SITE: ${{ github.workspace }}/site
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
        id: today
      # NOAA's records, kept for the month so a rebuild doesn't ask for them again. Not the cooling runs, or anything else worked out by the code.
      - uses: actions/cache@v4
        with:
          path: |
            .wlcache/isd
            .wlcache/noaa_pfds_*
            .wlcache/climate/*_county_rain.json
          key: noaa-${{ inputs.state }}-${{ steps.today.outputs.month }}
      - name: Build the state (Michigan from its own sources, the others from the national tier)
        run: uv run waterledger build-state ${{ inputs.state }} --out build-report --no-checks
      - name: Check the state end to end
        if: ${{ contains(fromJSON('["OH","VA","TX"]'), inputs.state) }}
        run: |
          st=$(echo "${{ inputs.state }}" | tr '[:upper:]' '[:lower:]')
          WATERLEDGER_DATA=live uv run pytest -m "live and state_$st" -v tests/test_national_places.py tests/test_national_water.py tests/test_national_context.py tests/test_national_estimate.py
      - name: Write the snapshot and check it statewide
        run: |
          uv run waterledger snapshot ${{ inputs.state }} --out snapshot ${{ inputs.snapshot_id && format('--date {0}', inputs.snapshot_id) || '' }}
          if [ "${{ inputs.state }}" = "MI" ]; then
            uv run pytest -m live -v tests/test_snapshot_michigan.py
            uv run waterledger check-snapshot MI --dir snapshot
            echo '{"state": "MI", "note": "built from Michigan sources by build-state"}' > snapshot/MI_build.json
          else
            uv run waterledger check-snapshot ${{ inputs.state }} --dir snapshot
            cp build-report/${{ inputs.state }}_build.json snapshot/
          fi
          du -ah snapshot | sort -h | tail -12
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ inputs.state }}
          path: snapshot/
      - name: Upload to R2 (data.waterledger.org)
        if: ${{ inputs.upload }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          ST: ${{ inputs.state }}
        run: |
          DATE=$(ls snapshot/$ST)
          # is this object there? Only a real not-found counts as absent; any other error stops the job
          exists() {
            if err=$(aws s3api head-object --bucket waterledger-data --key "$1" --endpoint-url $R2 2>&1); then return 0; fi
            case "$err" in *"(404)"*) return 1;; esac
            echo "could not check $1: $err"; exit 1
          }
          if exists $ST/$DATE/manifest.json; then
            echo "$ST/$DATE is already published and a published snapshot never changes: run again with snapshot_id=$DATE.2 (or the next free number)"; exit 1
          fi
          if exists $ST/latest.json; then aws s3 cp s3://waterledger-data/$ST/latest.json old-latest.json --endpoint-url $R2; fi    # before anything is written
          aws s3 cp --recursive snapshot/$ST/$DATE s3://waterledger-data/$ST/$DATE --endpoint-url $R2
          aws s3 cp snapshot/${ST}_build.json s3://waterledger-data/$ST/$DATE/build.json --endpoint-url $R2
          uv run waterledger latest-json $ST $DATE --from old-latest.json > latest.json
          aws s3 cp latest.json s3://waterledger-data/$ST/latest.json --endpoint-url $R2 --cache-control "max-age=300"
          echo "published https://data.waterledger.org/$ST/$DATE/manifest.json"
