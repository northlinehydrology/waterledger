name: tests
# Every push and pull request: lint, then the tests on each supported Python.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uv run pytest
      - name: CSDMS bmi-tester on every BMI component
        working-directory: tests/bmi
        run: |
          uv run bmi-test waterledger_models.datacenter.bmi:CoolingWaterBmi --root-dir . --config-file cooling.yaml
          uv run bmi-test waterledger_models.datacenter.bmi:LakeCoolingBmi --root-dir . --config-file lake.yaml
