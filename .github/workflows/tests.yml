name: tests
# Every push and pull request: lint, then the tests on each supported Python.
on:
  push:
    branches: [main, windows]   # windows: until the branch is merged
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff check .
      - name: Text files opened with an encoding (UTF-8, as on Mac and Linux; Windows' default is cp1252)
        run: uvx ruff check --preview --select PLW1514 .
      - run: uv run pytest
      - name: CSDMS bmi-tester on every BMI component
        working-directory: tests/bmi
        run: |
          uv run bmi-test waterledger_models.datacenter.bmi:CoolingWaterBmi --root-dir . --config-file cooling.yaml
          uv run bmi-test waterledger_models.datacenter.bmi:LakeCoolingBmi --root-dir . --config-file lake.yaml
          uv run bmi-test waterledger_models.battery.bmi:BatteryCellBmi --root-dir . --config-file battery.yaml
          uv run bmi-test waterledger_models.gas.bmi:GasPlantBmi --root-dir . --config-file gas.yaml

  # Windows: the tests and the BMI checks on the newest supported Python
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - name: CSDMS bmi-tester on every BMI component
        working-directory: tests/bmi
        run: |
          uv run bmi-test waterledger_models.datacenter.bmi:CoolingWaterBmi --root-dir . --config-file cooling.yaml
          uv run bmi-test waterledger_models.datacenter.bmi:LakeCoolingBmi --root-dir . --config-file lake.yaml
          uv run bmi-test waterledger_models.battery.bmi:BatteryCellBmi --root-dir . --config-file battery.yaml
          uv run bmi-test waterledger_models.gas.bmi:GasPlantBmi --root-dir . --config-file gas.yaml
