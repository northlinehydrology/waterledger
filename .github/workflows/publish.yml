name: publish
# Push a tag v* (for example v2026.10.29) to release: the tests run, the three packages are built, and each is published to PyPI
# by trusted publishing (no stored token) from the environment pypi-<package>. A package whose version is already on PyPI is
# skipped, so bump only what changed. Each tag then gets a GitHub release, its notes from that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
      - run: |
          for p in waterledger-models waterledger-data waterledger; do uv build --package $p -o dist/$p; done
          uvx twine check dist/*/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    # one run per package; each publishes from the environment pypi-<package>, which its PyPI trusted publisher names
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [waterledger-models, waterledger-data, waterledger]
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v h="## $v " 'index($0,h)==1{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "waterledger $v" --notes-file notes.md
