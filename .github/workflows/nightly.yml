name: nightly
# Each night: build the three packages, install them from the built wheels in a clean environment and run the tests against
# those (what PyPI users would get), and check that every public data source still answers. A failure opens an issue.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build --all-packages -o dist
      - run: uvx twine check dist/*
      - name: Test the built wheels in a clean environment
        run: |
          uv venv /tmp/wheels --python 3.12
          uv pip install --python /tmp/wheels/bin/python dist/*.whl pytest
          /tmp/wheels/bin/python -c "import waterledger as wl; print('waterledger', wl.__version__, 'model', wl.models.MODEL_VERSION)"
          /tmp/wheels/bin/python -m pytest -p no:cacheprovider tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # A facility run at its place (battery cell plants, the supply scenarios) reads EIA-930's hourly generation by balancing authority, which isn't in
      # the snapshots: grid930.build() writes it (about 600 MB of EIA files, 44 MB kept). Without it those runs have no grid water.
      - id: year
        run: echo "year=$(date +%Y)" >> "$GITHUB_OUTPUT"
      - id: grid930
        uses: actions/cache@v4
        with:
          path: ~/.cache/waterledger/grid930/ba
          key: grid930-${{ steps.year.outputs.year }}
      - name: EIA-930 by balancing authority (once a year; cached)
        if: steps.grid930.outputs.cache-hit != 'true'
        run: uv run python -c "from waterledger_data import grid930; print(len(grid930.build()), 'balancing authorities')"
      - run: uv run pytest -m live -v
      - name: Reproduce Water Ledger's published estimates (30 years of weather, one Open-Meteo request)
        run: WATERLEDGER_FETCH=1 uv run pytest -v tests/test_reproduction.py
  report:
    needs: [packages, sources]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue (once) when the nightly build fails
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$(gh issue list --label nightly --state open --json number --jq '.[].number')" ]; then
            gh label create nightly --color B60205 --force
            gh issue create --label nightly --title "Nightly build failed" \
              --body "The nightly build or a data source check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
